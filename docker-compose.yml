services:
  banco:
    image: mysql:oraclelinux9
    container_name: container_banco
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: senhadoroot
      MYSQL_DATABASE: projeto_web
      MYSQL_USER: usuario_projeto
      MYSQL_PASSWORD: senhadousuario
    volumes:
      - dados-db:/var/lib/mysql
      - ./banco/projeto_web.sql:/docker-entrypoint-initdb.d/projeto_web.sql
    networks:
      - infra-network

  app1:
    build: ./backend
    container_name: app_instancia_1
    restart: always
    environment:
      - DB_HOST=banco
      - DB_USER=root
      - DB_PASSWORD=senhadoroot
      - DB_NAME=projeto_web
      - DB_PORT=3306
    depends_on:
      - banco
    networks:
      - infra-network

  app2:
    build: ./backend
    container_name: app_instancia_2
    restart: always
    environment:
      - DB_HOST=banco
      - DB_USER=root
      - DB_PASSWORD=senhadoroot
      - DB_NAME=projeto_web
      - DB_PORT=3306
    depends_on:
      - banco
    networks:
      - infra-network

  nginx:
    image: nginx:latest
    container_name: container_nginx
    restart: always
    ports:
      - "80:80" 
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2
    networks:
      - infra-network

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: container_nginx_exporter
    restart: always
    command:
      - -nginx.scrape-uri=http://nginx:8080/stub_status
    depends_on:
      - nginx
    networks:
      - infra-network

  frontend:
    build: ./frontend
    container_name: app_frontend
    restart: always
    ports:
      - "3000:3000" 
    environment:
      - NODE_ENV=development
    depends_on:
      - nginx 
    networks:
      - infra-network

  prometheus:
    image: prom/prometheus:latest
    container_name: container_prometheus
    restart: always
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - infra-network
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: container_grafana
    restart: always
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin 
    depends_on:
      - prometheus
    networks:
      - infra-network


networks:
  infra-network:
    driver: bridge

volumes:
  dados-db: